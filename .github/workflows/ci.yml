name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: wd, POSTGRES_PASSWORD: wdpass, POSTGRES_DB: wheelsdown }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Start server against Postgres
        run: |
          NODE_ENV=production DATABASE_URL=postgresql://wd:wdpass@localhost:5432/wheelsdown SEED_MODE=demo \
          ADMIN_KEY=ci-admin-key-0123456789abcdef PORT=5000 node dist/index.cjs > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:5000/api/health && break; sleep 1; done
      - run: ADMIN_KEY=ci-admin-key-0123456789abcdef bash script/smoke.sh
      - if: failure()
        run: cat server.log
